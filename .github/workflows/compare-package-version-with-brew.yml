name: compare package version with brew

on:
  workflow_dispatch:

  schedule:
    - cron: '0 20 * * *'

jobs:
  compare:

    runs-on: macos-15

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - run: brew update

      - uses: actions/checkout@v5

      - run: curl -LO https://github.com/leleliu008/test/releases/download/2023.10.08/xcpkg-0.30.0-macos-15.0-arm64.release.tar.xz
      - run: /usr/bin/bsdtar xf xcpkg-0.30.0-macos-15.0-arm64.release.tar.xz --strip-components=1
      - run: mv bin/xcpkg .

      - run: ./xcpkg about
      - run: ./xcpkg sysinfo

      - run: ./compare-package-version-with-brew
      - run: ./compare-package-version-with-maven
