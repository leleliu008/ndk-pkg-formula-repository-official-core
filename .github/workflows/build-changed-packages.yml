name: build changed packages

on:
  push:
    branches: [ master,dev ]
    paths:
      - 'formula/*.yml'

  pull_request:
    branches: [ master,dev ]
    paths:
      - 'formula/*.yml'

jobs:

  find-changed-packages:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: 'formula/*.yml'
          json: true

      - id: changed-packages
        run: |
          NAMES=$(printf '%s\n' ${{ steps.changed-files.outputs.all_changed_files }} | jq -c '
            map(
              sub("^formula/"; "")
              | sub("\\.yml$"; "")
            )
          ')
          printf 'names=%s\n' "$NAMES" >> $GITHUB_OUTPUT

    outputs:
      names: ${{ steps.changed-packages.outputs.names }}


  ubuntu:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}
        opt: ['--static', '']

    runs-on: ubuntu-latest

    container: ubuntu:24.04

    steps:
      - uses: actions/checkout@v5

      - run: install -d ~/.ndk-pkg/repos.d/
      - run: ln -s .    ~/.ndk-pkg/repos.d/

      - run: apt -y update
      - run: apt -y install curl

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo
      - run: ./ndk-pkg-install ${{ matrix.pkg }} ${{ matrix.abi }} ${{ matrix.opt }}


  alpine:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}
        opt: ['--static', '']

    runs-on: ubuntu-latest

    container: alpine

    steps:
      - uses: actions/checkout@v5

      - run: install -d ~/.ndk-pkg/repos.d/
      - run: ln -s .    ~/.ndk-pkg/repos.d/

      - run: wget https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo
      - run: ./ndk-pkg-install ${{ matrix.pkg }} ${{ matrix.abi }} ${{ matrix.opt }}


  macos:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        os:  ['26', '15']
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}
        opt: ['--static', '']

    runs-on: macos-${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - run: install -d ~/.ndk-pkg/repos.d/
      - run: ln -s .    ~/.ndk-pkg/repos.d/

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod u+x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo
      - run: ./ndk-pkg-install ${{ matrix.pkg }} ${{ matrix.abi }} ${{ matrix.opt }}
