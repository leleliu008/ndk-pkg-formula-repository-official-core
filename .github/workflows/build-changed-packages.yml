name: build changed packages

on:
  push:
    branches: [ master,dev ]
    paths:
      - 'formula/*.yml'

  pull_request:
    branches: [ master,dev ]
    paths:
      - 'formula/*.yml'

jobs:

  find-changed-packages:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: 'formula/*.yml'
          json: true

      - id: changed-packages
        run: |
          NAMES=$(printf '%s\n' ${{ steps.changed-files.outputs.all_changed_files }} | jq -c '
            map(
              sub("^formula/"; "")
              | sub("\\.yml$"; "")
            )
          ')
          printf 'names=%s\n' "$NAMES" >> $GITHUB_OUTPUT

    outputs:
      names: ${{ steps.changed-packages.outputs.names }}


  ubuntu:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}

    runs-on: ubuntu-latest

    container: ubuntu:26.04

    steps:
      - uses: actions/checkout@v5

      ############################################################

      - run: apt -y update
      - run: apt -y install curl

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo

      - run: printf 'NDKPKG_FORMULA_DIRS=%s\n' "$GITHUB_WORKSPACE/formula" >> "$GITHUB_ENV"

      ############################################################

      - id:  api-level-1
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }})" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }}
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-1
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-1.outputs.FILENAME }}
          path: ${{ steps.bundle-1.outputs.FILENAME }}

      ############################################################

      - run: rm *.tar.xz

      ############################################################

      - id:  api-level-2
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }} --static)" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} --static
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-2
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - if: steps.bundle-1.outputs.FILENAME != steps.bundle-2.outputs.FILENAME
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-2.outputs.FILENAME }}
          path: ${{ steps.bundle-2.outputs.FILENAME }}



  alpine:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}

    runs-on: ubuntu-latest

    container: alpine

    steps:
      - uses: actions/checkout@v5

      ############################################################

      - run: wget https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo

      - run: printf 'NDKPKG_FORMULA_DIRS=%s\n' "$GITHUB_WORKSPACE/formula" >> "$GITHUB_ENV"

      ############################################################

      - id:  api-level-1
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }})" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }}
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-1
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-1.outputs.FILENAME }}
          path: ${{ steps.bundle-1.outputs.FILENAME }}

      ############################################################

      - run: rm *.tar.xz

      ############################################################

      - id:  api-level-2
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }} --static)" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} --static
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-2
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - if: steps.bundle-1.outputs.FILENAME != steps.bundle-2.outputs.FILENAME
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-2.outputs.FILENAME }}
          path: ${{ steps.bundle-2.outputs.FILENAME }}


  macos:

    needs: find-changed-packages

    strategy:

      fail-fast: false

      matrix:
        os:  ['26', '15']
        abi: [arm64-v8a]
        pkg: ${{ fromJson(needs.find-changed-packages.outputs.names) }}

    runs-on: macos-${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod u+x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo

      - run: printf 'NDKPKG_FORMULA_DIRS=%s\n' "$GITHUB_WORKSPACE/formula" >> "$GITHUB_ENV"

      ############################################################

      - id:  api-level-1
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }})" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }}
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-1
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-1.outputs.FILENAME }}
          path: ${{ steps.bundle-1.outputs.FILENAME }}

      ############################################################

      - run: rm *.tar.xz

      ############################################################

      - id:  api-level-2
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }} --static)" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} --static
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-2
        run: printf 'FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - if: steps.bundle-1.outputs.FILENAME != steps.bundle-2.outputs.FILENAME
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-2.outputs.FILENAME }}
          path: ${{ steps.bundle-2.outputs.FILENAME }}
