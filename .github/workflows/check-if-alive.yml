name: check if urls are alive

on:
  workflow_dispatch:

  schedule:
    - cron: '0 22 * * *'

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo

      - run: |
          export NDKPKG_FORMULA_DIRS="$PWD/formula"

          cd formula

          for f in *.yml
          do
              PKGNAME="${f%.yml}"
              printf '\n%b\n' "\033[0;31m==> $PKGNAME\033[0m"
              ../ndk-pkg fetch "$PKGNAME"
          done
