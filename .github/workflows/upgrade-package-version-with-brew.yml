name: update package version with brew

on:
  workflow_dispatch:

  schedule:
    - cron: '0 23 * * *'

jobs:
  find-upgradable-packages:

    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - run: brew update

      - uses: actions/checkout@v5

      - run: curl -LO https://github.com/leleliu008/uppm-package-repository-macos-15.0-arm64/releases/download/2026.08.10.1/findutils-4.10.0-MacOSX-15.0-arm64.tar.xz
      - run: /usr/bin/bsdtar xf *.tar.xz --strip-components=1
      - run: rm *.tar.xz

      - run: curl -LO https://github.com/leleliu008/test/releases/download/2023.10.08/xcpkg-0.30.0-macos-15.0-arm64.release.tar.xz
      - run: /usr/bin/bsdtar xf *.tar.xz --strip-components=1
      - run: rm *.tar.xz
      - run: mv bin/xcpkg .

      - run: ./xcpkg about
      - run: ./xcpkg sysinfo

      - run: ./compare-package-version-with-brew --upgrade

      - run: mv formula/upgrade .

      - uses: actions/upload-artifact@v6
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade/

      - id: upgradable-packages
        run: |
          set -ex
          NAMES="$(cd upgrade && ls | jq -Rnc '[inputs]')"
          printf 'names=%s\n' "$NAMES" >> $GITHUB_OUTPUT

    outputs:
      names: ${{ steps.upgradable-packages.outputs.names }}


  upgrade:

    needs: find-upgradable-packages

    strategy:

      fail-fast: false

      matrix:
        pkg: ${{ fromJson(needs.find-upgradable-packages.outputs.names) }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: |
            cat > .ndk-pkg-formula-repo.yml <<EOF
            url: https://github.com/leleliu008/ndk-pkg-formula-repository-official-core
            branch: master
            pinned: 0
            enabled: 1
            created: 1673684639
            EOF

      - run: install -d ~/.ndk-pkg/repos.d/
      - run: ln -s "$GITHUB_WORKSPACE" ~/.ndk-pkg/repos.d/
      - run: ls ~/.ndk-pkg/repos.d/

      ############################################################

      - uses: actions/download-artifact@v8
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade

      - id: upgrade-info
        run: cat upgrade/${{ matrix.pkg }} >> "$GITHUB_OUTPUT"

      ############################################################

      - run: |
          sed -i \
              -e '/^version: /c version: ${{ steps.upgrade-info.outputs.VERSION_NEW }}' \
              -e '/^src-url: /c src-url: ${{ steps.upgrade-info.outputs.SRC_URL_NEW }}' \
              -e '/^src-sha: /c src-sha: ${{ steps.upgrade-info.outputs.SRC_SHA_NEW }}' \
              -e '/^git-sha: /c git-sha: ${{ steps.upgrade-info.outputs.GIT_SHA_NEW }}' \
              -e '/^git-tag: /c git-tag: ${{ steps.upgrade-info.outputs.GIT_TAG_NEW }}' \
              formula/${{ matrix.pkg }}.yml

      ############################################################

      - run: git diff

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ndk-pkg/${{ github.ref_name }}/ndk-pkg
      - run: chmod +x ndk-pkg

      - run: ./ndk-pkg about
      - run: ./ndk-pkg setup
      - run: ./ndk-pkg sysinfo
      - run: ./ndk-pkg formula-repo-list

      ############################################################

      - id:  api-level-1
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }})" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }}
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-1.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-1
        run: printf 'BUNDLE_FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-1.outputs.BUNDLE_FILENAME }}
          path: ${{ steps.bundle-1.outputs.BUNDLE_FILENAME }}

      ############################################################

      - run: rm *.tar.xz

      ############################################################

      - id:  api-level-2
        run: printf 'API_LEVEL=%s\n' "$(./api-level ${{ matrix.pkg }} --static)" >> "$GITHUB_OUTPUT"

      - run: ./ndk-pkg install android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} --static
      - run: ./ndk-pkg bundle  android-${{ steps.api-level-2.outputs.API_LEVEL }}-arm64-v8a/${{ matrix.pkg }} .tar.xz

      - id: bundle-2
        run: printf 'BUNDLE_FILENAME=%s\n' "$(ls *.tar.xz)" >> "$GITHUB_OUTPUT"

      - if: steps.api-level-1.outputs.API_LEVEL != steps.api-level-2.outputs.API_LEVEL
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bundle-2.outputs.BUNDLE_FILENAME }}
          path: ${{ steps.bundle-2.outputs.BUNDLE_FILENAME }}

      ############################################################

      - run: git config --global user.name  leleliu008
      - run: git config --global user.email leleliu008@gmail.com

      - run: git add formula/${{ matrix.pkg }}.yml
      - run: git commit -m 'update package ${{ matrix.pkg }} ${{ steps.upgrade-info.outputs.VERSION_OLD }} -> ${{ steps.upgrade-info.outputs.VERSION_NEW }}'
      - run: git pull --rebase=true
      - run: git push origin master
