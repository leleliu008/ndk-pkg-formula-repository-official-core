summary: Library and utilities for processing GIFs
web-url: https://giflib.sourceforge.net/
git-url: https://git.code.sf.net/p/giflib/code
src-url: https://downloads.sourceforge.net/project/giflib/giflib-6.x/giflib-6.1.3.tar.gz
src-sha: b65b66b99f0424b93525f987386f22fc5efb9da2bfc92ad4a532249aaffbab0e

dopatch: |
    gsed -i \
         -e '/^USOURCES = /s|$| gif_err.c|' \
         -e '/^CC /d' \
         -e '/^CFLAGS /d' Makefile

install: |
    gmakew clean
    gmakew libgif.a
    gmakew libutil.a
    gmakew install-bin PREFIX="$PACKAGE_INSTALL_DIR"
