summary: A free, general-purpose data compression with a high compression ratio
web-url: https://tukaani.org/xz
src-url: https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.gz
src-sha: 0014c7886930454fe8bd4228665b51af55eeae560ea135c9c4cd33f55b2591d9
license: LGPL-2.1-or-later

install: |
    configure \
        --disable-external-sha256 \
        --disable-werror \
        --disable-nls \
        --enable-assembler \
        --enable-threads=posix \
        --disable-xz \
        --disable-xzdec \
        --disable-lzmadec \
        --disable-lzmainfo \
        --disable-lzma-links \
        --disable-scripts
