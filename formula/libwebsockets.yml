summary: A flexible, lightweight pure C library for implementing modern network protocols easily with a tiny footprint, using a nonblocking event loop
web-url: https://libwebsockets.org/
src-url: https://github.com/warmcat/libwebsockets/archive/refs/tags/v5.0.0.tar.gz
src-sha: f853c6582101cfcee3a5a9e28ae92ab19d9735c5f31f0bb2e9794b5106123962
license: MIT
dep-pkg: libz libuv libevent

install: |
    cmakew \
        -DDISABLE_WERROR=ON \
        -DLWS_IPV6=ON \
        -DLWS_UNIX_SOCK=ON \
        -DLWS_WITH_HTTP2=ON \
        -DLWS_WITH_HTTP3=OFF \
        -DLWS_WITH_LIBUV=ON \
        -DLWS_WITH_LIBEVENT=ON \
        -DLWS_WITH_MBEDTLS=OFF \
        -DLWS_WITH_PLUGINS=OFF \
        -DLWS_WITHOUT_TESTAPPS=ON \
        -DLWS_OPENSSL_SUPPORT=ON \
        -DLWS_BUILD_HASH=no_hash

# keep in sync with libuv
api-min: 24
