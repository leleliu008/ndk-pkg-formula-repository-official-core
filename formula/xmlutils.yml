summary: A collections of command-line utilities provided by libxml2
src-url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
src-sha: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
license: MIT
dep-pkg: libiconv libz

install: |
    configure \
        --with-iconv="$libiconv_INSTALL_DIR" \
        --with-zlib \
        --without-lzma \
        --without-python \
        --without-readline \
        --without-coverage \
        --without-debug \
        --enable-ipv6 \
        --enable-static \
        --disable-shared \
        LIBS=-liconv

dotweak: rm -rf include/ lib/ bin/xml2-config share/aclocal/ share/doc/ share/gtk-doc/ share/man/man1/xml2-config.1
