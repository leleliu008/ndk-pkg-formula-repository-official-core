summary: A command-line tool for drawing graphs
web-url: https://www.graphviz.org/
git-url: https://gitlab.com/graphviz/graphviz
src-url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.1/graphviz-16.1.1.tar.xz
src-sha: 52e7fb9a57b52b5c67f41dba6504ba3231e118258779421cb8f4f99104de71f6
license: EPL-1.0
dep-pkg: libgd libpango libglob
dep-upp: libtool gm4 flex bison gawk git python3

prepare: export LDFLAGS="$LDFLAGS --static -static"

install: |
    configure only \
        --disable-swig \
        --disable-php \
        --disable-tcl \
        --without-gdk \
        --without-gtk \
        --without-qt \
        --without-x
    gmakew
    gmakew -C cmd/dot dot_static
    install_bins cmd/dot/dot_static
