summary: A command-line tool for drawing graphs
web-url: https://www.graphviz.org/
git-url: https://gitlab.com/graphviz/graphviz
src-url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.2/graphviz-16.1.2.tar.xz
src-sha: 9780938f03659e2effbbfbbaec94940108e794199b73196fa339ca911890e8c9
license: EPL-1.0
dep-pkg: libgd libpango libglob
dep-upp: libtool gm4 flex bison gawk git python3

prepare: export LDFLAGS="$LDFLAGS --static -static"

install: |
    configure only \
        --disable-swig \
        --disable-php \
        --disable-tcl \
        --without-gdk \
        --without-gtk \
        --without-qt \
        --without-x
    gmakew
    gmakew -C cmd/dot dot_static
    install_files cmd/dot/dot_static
