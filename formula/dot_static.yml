summary: A command-line tool for drawing graphs
web-url: https://www.graphviz.org/
git-url: https://gitlab.com/graphviz/graphviz
src-url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.0/graphviz-16.1.0.tar.xz
src-sha: 0f661718f3e5268dc3bad0fb53ab646605d26db70f4080799aff1dc2f61783c3
license: EPL-1.0
dep-pkg: libgd libpango libglob
dep-upp: libtool gm4 flex bison gawk git python3

prepare: export LDFLAGS="$LDFLAGS --static -static"

install: |
    configure only \
        --disable-swig \
        --disable-php \
        --disable-tcl \
        --without-gdk \
        --without-gtk \
        --without-qt \
        --without-x
    gmakew
    gmakew -C cmd/dot dot_static
    install_bins cmd/dot/dot_static
