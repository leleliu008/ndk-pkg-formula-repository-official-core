summary: A free and easy-to-use client-side URL transfer library
git-url: https://github.com/curl/curl
web-url: https://curl.se/
src-url: https://curl.se/download/curl-8.22.0.tar.bz2
src-sha: 5d956a6a22b3c279f50c421ee5d3c9e9d660cb6f115dcf881b579e952130549c
license: curl
dep-pkg: libnghttp2 libcares libzstd libz libbrotli libopenssl
dep-upp: perl

install: |
    configure \
        --enable-optimize \
        --enable-pthreads \
        --enable-ares \
        --with-default-ssl-backend=openssl \
        --with-ssl="$libopenssl_INSTALL_DIR" \
        --with-nghttp2 \
        --without-nghttp3 \
        --without-ngtcp2 \
        --without-quiche \
        --without-libpsl \
        --without-librtmp \
        --without-libidn2

dotweak: |
    run rm -f bin/curl share/man/man1/curl.1

    gsed -i '/Libs.private:/d' lib/pkgconfig/libcurl.pc
