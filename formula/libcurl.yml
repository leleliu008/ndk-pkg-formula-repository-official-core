summary: A free and easy-to-use client-side URL transfer library
git-url: https://github.com/curl/curl
src-url: https://curl.se/download/curl-8.23.0.tar.bz2
src-sha: 95b22eb32bf6d1fa6e3e9463bdb61cece3efc56d86576a9b3cbd428246a6d854
license: curl
dep-pkg: libnghttp2 libcares libzstd libz libbrotli libopenssl
dep-upp: perl

install: |
    configure \
        --enable-optimize \
        --enable-pthreads \
        --enable-ares \
        --with-default-ssl-backend=openssl \
        --with-ssl="$libopenssl_INSTALL_DIR" \
        --with-nghttp2 \
        --without-nghttp3 \
        --without-ngtcp2 \
        --without-quiche \
        --without-libpsl \
        --without-librtmp \
        --without-libidn2

dotweak: |
    run rm -f bin/curl share/man/man1/curl.1

    gsed -i -e '/Libs.private:/d' -e 's|libbrotlicommon|libz|' lib/pkgconfig/libcurl.pc
