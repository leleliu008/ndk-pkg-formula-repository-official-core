summary: Image processing tools collection
web-url: http://www.graphicsmagick.org/
src-url: https://downloads.sourceforge.net/project/graphicsmagick/graphicsmagick/1.3.49/GraphicsMagick-1.3.49.tar.xz
src-sha: 7efa070dc31116b4315061b39f84bc7181e8b060bf61214ec9af851131af9c81
license: MIT
dep-pkg: libltdl libfreetype libxml2 libjasper libjxl
dep-upp: libtool
install: |
    configure \
        --disable-openmp \
        --disable-static \
        --enable-shared \
        --with-modules \
        --with-quantum-depth=16 \
        --without-lzma \
        --without-x \
        --without-gslib \
        --without-wmf \
        --with-jxl LIBS=-ldl
