summary: An open-source C/C++ library for formatting that provides a fast and safe alternative to C stdio and C++ iostreams
web-url: https://fmt.dev
src-url: https://github.com/fmtlib/fmt/releases/download/12.2.0/fmt-12.2.0.zip
src-sha: a2f4a8d51178f954e4c339007f77edd76ba0cb2e36f87a48e5a5403d9be5878f
license: MIT

install: |
    cmakew 2 \
        -DFMT_FUZZ=OFF \
        -DFMT_TEST=OFF \
        -DFMT_INSTALL=ON \
        -DFMT_WERROR=OFF \
        -DFMT_PEDANTIC=OFF
