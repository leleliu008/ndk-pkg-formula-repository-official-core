summary: An open-source C/C++ library for formatting that provides a fast and safe alternative to C stdio and C++ iostreams
web-url: https://fmt.dev
src-url: https://github.com/fmtlib/fmt/releases/download/12.2.1/fmt-12.2.1.zip
src-sha: 870a49acec5bcdab236aeea834ebd7f0b8548a7d8cea33c996b6873a37f2d50c
license: MIT

install: |
    cmakew 2 \
        -DFMT_FUZZ=OFF \
        -DFMT_TEST=OFF \
        -DFMT_INSTALL=ON \
        -DFMT_WERROR=OFF \
        -DFMT_PEDANTIC=OFF
