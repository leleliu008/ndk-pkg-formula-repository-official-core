summary: C++ library for processing command-line flags
web-url: https://gflags.github.io/gflags
src-url: https://github.com/gflags/gflags/archive/refs/tags/v2.3.1.tar.gz
src-sha: 1b5e0648d7b94021895086e65479b4eaca7935eecfffd7dd9512eb576181c53d
license: BSD-3-Clause

install: |
    cmakew \
        -DGFLAGS_BUILD_SHARED_LIBS=ON \
        -DGFLAGS_BUILD_STATIC_LIBS=ON \
        -DGFLAGS_BUILD_gflags_LIB=ON \
        -DGFLAGS_BUILD_gflags_nothreads_LIB=ON \
        -DGFLAGS_BUILD_TESTING=OFF \
        -DGFLAGS_BUILD_PACKAGING=OFF
