summary: GNU Pretty Good Privacy (PGP) package
git-url: https://dev.gnupg.org/source/gnupg
src-url: https://www.gnupg.org/ftp/gcrypt/gnupg/gnupg-2.5.24.tar.bz2
src-sha: bf149d01a2b9fcc0e4589b8ae8697d3d5c557ea48ed95a3fa55dd3b1187e6039
license: GPL-3.0-or-later
dep-pkg: libreadline libgcrypt libassuan libksba libnpth libiconv libbz2 libz

prepare: export ac_cv_path_GPGRT_CONFIG="$libgpg_error_INSTALL_DIR/bin/gpgrt-config"

install: |
    configure \
        --disable-doc \
        --disable-assert \
        --disable-gcc-warnings \
        --enable-threads=posix \
        --with-included-regex
