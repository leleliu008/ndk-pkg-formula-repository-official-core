summary: Color management solution geared towards motion picture production
web-url: https://opencolorio.org/
src-url: https://github.com/AcademySoftwareFoundation/OpenColorIO/archive/refs/tags/v2.6.0.tar.gz
src-sha: 784ac37bde5b9c6e5dc15f23d1235bd1452d376cdc03627d6d6dd310f375a735
license: BSD-3-Clause
dep-pkg: libImath libexpat libyaml-cpp libpystring libminizip-ng
dep-upp: git
install: |
    cmakew 2 \
        -Dpystring_INCLUDE_DIR="$libpystring_INCLUDE_DIR/pystring" \
        -Dpystring_LIBRARY="$libpystring_LIBRARY_DIR/libpystring.so" \
        -DOCIO_BUILD_APPS=OFF \
        -DOCIO_BUILD_DOCS=OFF \
        -DOCIO_BUILD_TESTS=OFF \
        -DOCIO_BUILD_JAVA=OFF \
        -DOCIO_BUILD_PYTHON=OFF \
        -DOCIO_WARNING_AS_ERROR=OFF
