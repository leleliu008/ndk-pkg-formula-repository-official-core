summary: Library making programming with POSIX capabilities easier than traditional libcap
web-url: https://people.redhat.com/sgrubb/libcap-ng
src-url: https://github.com/stevegrubb/libcap-ng/archive/refs/tags/v0.9.6.tar.gz
src-sha: 399040138e0ca62fa2bcabd63da9af4431a246ef7a654561a0ca3cb00010a539
license: LGPL-2.1-or-later
dep-upp: libtool
bsystem: autogen

install: |
    configure \
        --with-warn \
        --without-debug \
        --without-python \
        --without-python3

# int getifaddrs(struct ifaddrs** __list_ptr) __INTRODUCED_IN(24);
# void freeifaddrs(struct ifaddrs* __ptr) __INTRODUCED_IN(24);
api-min: 24
