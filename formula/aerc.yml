dep-upp: scdoc
bsystem: gmake go

install: |
    gmakew clean
    gmakew PREFIX="$PACKAGE_INSTALL_DIR" VERSION=$PACKAGE_VERSION
    gmakew install PREFIX="$PACKAGE_INSTALL_DIR"

