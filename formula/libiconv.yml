summary: charset conversion library
src-url: https://ftp.gnu.org/gnu/libiconv/libiconv-1.19.1.tar.gz
src-sha: 9a06844846d664d7122161700c10a64480d7c7bcead3091925a785b38c91edab
license: GPL-3.0-or-later LGPL-2.0-or-later

install: configure --enable-extra-encodings

dotweak: |
    for item in iconv charset
    do
        writepc "lib$item" <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: lib$item
    URL: ${PACKAGE_WEB_URL}
    Description: ${PACKAGE_SUMMARY}
    Version: ${PACKAGE_VERSION}
    Libs: -L\${libdir} -l$item
    Cflags: -I\${includedir}
    EOF
    done
