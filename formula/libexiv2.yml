summary: C++ library to read, write, delete and modify Exif, IPTC, XMP and ICC image metadata
web-url: https://exiv2.org/
src-url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.9.tar.gz
src-sha: 700b76b97695b2fab4ef8c79619c68ae57d09e0c130724791cafbd39e0eb4aef
license: GPL-2.0-or-later
dep-pkg: libexpat libcurl libssh inih

install: |
    cmakew 2 \
        -DEXIV2_ENABLE_NLS=OFF \
        -DEXIV2_ENABLE_XMP=ON \
        -DEXIV2_ENABLE_PNG=ON \
        -DEXIV2_ENABLE_SSH=ON \
        -DEXIV2_ENABLE_CURL=ON \
        -DEXIV2_ENABLE_BMFF=ON \
        -DEXIV2_ENABLE_VIDEO=ON \
        -DEXIV2_ENABLE_LENSDATA=ON \
        -DEXIV2_ENABLE_WEBREADY=ON \
        -DEXIV2_ENABLE_PRINTUCS2=ON \
        -DEXIV2_BUILD_EXIV2_COMMAND=OFF \
        -DEXIV2_BUILD_SAMPLES=OFF
