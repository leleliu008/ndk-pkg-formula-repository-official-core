summary: An embeddable Javascript interpreter in C
git-url: https://codeberg.org/ccxvii/mujs
web-url: https://www.mujs.com/
src-url: https://mujs.com/downloads/mujs-1.3.11.tar.gz
src-sha: 456a395769daf110a30f9bf6f793044261e261481d5dca33b63cdc8714774ca4
license: ISC

install: |
    gmakew clean SO=so
    gmakew build/release/libmujs.a build/release/libmujs.so SO=so CFLAGS="'-std=c99 $CFLAGS $CPPFLAGS'" OPTIM=
    install_incs mujs.h
    install_libs build/release/libmujs.*

dotweak: |
    writepc mujs <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: mujs
    Description: $PACKAGE_SUMMARY
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lmujs -lm
    EOF
