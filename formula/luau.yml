summary: A fast, small, safe, gradually typed embeddable scripting language derived from Lua
web-url: https://luau-lang.org
src-url: https://github.com/luau-lang/luau/archive/refs/tags/0.744.tar.gz
src-sha: 08b960d377e1c3d6727c15a5ae9d415f9236efcda3aad05bfd82498ab9c20f6d
license: MIT
install: |
    cmakew \
        -DLUAU_BUILD_CLI=ON \
        -DLUAU_BUILD_TESTS=OFF
    install_bins luau luau-analyze luau-ast luau-compile luau-reduce
