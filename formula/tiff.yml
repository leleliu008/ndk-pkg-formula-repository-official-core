summary: TIFF library and utilities
web-url: https://libtiff.gitlab.io/libtiff
git-url: https://gitlab.com/libtiff/libtiff
src-url: https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz
src-sha: 672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a
dep-pkg: libwebp libjpeg-turbo libzstd liblzma libz
dep-lib: -lsharpyuv

install: |
    cmakew \
        -Dlzw=ON \
        -Dzlib=ON \
        -Dzstd=ON \
        -Dlzma=ON \
        -Dwebp=ON \
        -Djpeg=ON \
        -Djbig=ON \
        -Dlerc=ON \
        -Dtiff-docs=OFF \
        -Dtiff-tools=ON \
        -Dtiff-tests=ON \
        -Dtiff-contrib=ON \
        -DBUILD_SHARED_LIBS=OFF

dotweak: rm -rf include/ lib/
