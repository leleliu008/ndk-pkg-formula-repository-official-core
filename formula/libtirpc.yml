summary: Port of Sun Transport-Independent RPC library to Linux
web-url: https://sourceforge.net/projects/libtirpc
src-url: https://downloads.sourceforge.net/project/libtirpc/libtirpc/1.3.8/libtirpc-1.3.8.tar.bz2
src-sha: 8839959bfcc7a0f4c609d8e4f53f1c67ae33de23775ec35beb39ff15adf11920
license: BSD-3-Clause

ldflags: -Wl,--undefined-version

# int getifaddrs(struct ifaddrs** __list_ptr) __INTRODUCED_IN(24);
# void freeifaddrs(struct ifaddrs* __ptr) __INTRODUCED_IN(24);
# void endgrent(void) __INTRODUCED_IN(26);
api-min: 26

dopatch: |
    rm -v src/libtirpc.map
    gsed -i '/^CLEANFILES = /s|libtirpc\.map||' src/Makefile.in

install: |
    configure \
        --disable-gssapi \
        --enable-symvers \
        --enable-authdes \
        --enable-ipv6
