summary: C library that provides an easy way to add styling to programs that produce output to a console or terminal emulator window
src-url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
src-sha: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
license: GPL-3.0-or-later
dep-pkg: libiconv libncurses
bscript: libtextstyle

install: |
    configure \
        --enable-nls \
        --enable-curses \
        --enable-namespacing \
        --enable-threads=posix \
        --with-libiconv-prefix="$libiconv_INSTALL_DIR" \
        --with-libncurses-prefix="$libncurses_INSTALL_DIR"

dotweak: |
    writepc libtextstyle <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libtextstyle
    Description: $PACKAGE_SUMMARY
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -ltextstyle
    Requires: libiconv
    EOF
