pkgtype: exe+lib
summary: Tool Command Language
web-url: https://www.tcl-lang.org
src-url: https://downloads.sourceforge.net/project/tcl/Tcl/9.1.0/tcl9.1.0-src.tar.gz
src-sha: 536c45543f64d6eb11832d97ba3494aacff046fbc5040273bd55258d0e448ff1
dep-pkg: libz liblanginfo
version: 9.1.0
license: TCL
bscript: unix

dopatch: |
    gsed -i 's/test "`uname -s`" = "Darwin"/false/g' configure

prepare: |
    if [ "$TARGET_PLATFORM_NBIT" -eq 64 ] ; then
        EXTRA_CONFIGURE_FLAGS='--enable-64bit'
    else
        EXTRA_CONFIGURE_FLAGS='--disable-64bit'
    fi

install: |
    configure \
        --enable-dtrace \
        --enable-load \
        --enable-dll-unloading \
        --enable-threads \
        --disable-symbols \
        --disable-corefoundation \
        --disable-framework \
        --disable-zipfs \
        --with-tzdata \
        $EXTRA_CONFIGURE_FLAGS \
        tcl_cv_sys_version=Linux LIBS=-lm
