summary: Macro processing language
src-url: https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz
src-sha: f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66
license: GPL-3.0-or-later

dopatch: gsed -i -e '/ftello/d' -e '/fseeko/d' ../include/ndk-pkg-common.h

install: |
    configure \
        --program-prefix=g \
        --enable-threads=posix \
        --enable-c++ \
        --enable-changeword \
        --disable-assert \
        --disable-gcc-warnings \
        --without-dmalloc \
        --with-included-regex

dotweak: ln -s gm4 bin/m4
