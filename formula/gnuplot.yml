summary: A command-line utility for producing 2D and 3D plots
web-url: http://www.gnuplot.info/
git-url: https://git.code.sf.net/p/gnuplot/gnuplot-main.git
src-url: https://downloads.sourceforge.net/project/gnuplot/gnuplot/6.0.6/gnuplot-6.0.6.tar.gz
src-sha: 9d39d8499c9533550144092375aac45ba8bf0c18c9cee50897fe411b6d93004e
license: gnuplot
dep-pkg: libgd libcerf libpango libreadline
bsystem: autotools

dopatch: |
    gsed -i -e '/SUBDIRS = /s| docs||g' -e '/SUBDIRS = /s| demo||g' Makefile.am

install: |
    configure \
        --disable-wxwidgets \
        --without-tutorial \
        --without-x \
        --without-qt \
        --without-latex
