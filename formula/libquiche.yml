summary: Savoury implementation of the QUIC transport protocol and HTTP/3
src-url: https://github.com/cloudflare/quiche/archive/refs/tags/0.30.1.tar.gz
src-sha: c2c55d42677f0f1f42045e4c3e31469dc2107059bb519551b4c1c5a42f662a51
license: BSD-2-Clause
dep-pkg: libfontconfig
bsystem: cargo cmake

install: |
    cargow build --features ffi,pkg-config-meta
    install_incs quiche/include/quiche.h
    install_libs target/$RUST_TARGET/release/libquiche.a
    install_libs target/$RUST_TARGET/release/libquiche.so
    install_pcfs target/$RUST_TARGET/release/quiche.pc
