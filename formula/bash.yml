summary: Bourne-Again SHell, a UNIX command interpreter
src-url: https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz
src-sha: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
version: 5.3.20
license: GPL-3.0-or-later
dep-pkg: libreadline

# https://github.com/openwrt/packages/issues/26469
prepare: export CFLAGS_FOR_BUILD="$CFLAGS_FOR_BUILD -std=gnu11"

install: |
    configure \
        --with-curses \
        --without-bash-malloc \
        --disable-static-link \
        --disable-profiling \
        --enable-readline \
        --enable-select \
        --enable-history \
        bash_cv_func_strchrnul_works=yes

# void endgrent(void) __INTRODUCED_IN(26);
api-min: 26

