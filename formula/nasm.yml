summary: Netwide Assembler (NASM) is an 80x86 assembler
git-url: https://github.com/netwide-assembler/nasm
src-url: https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz
src-sha: 87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d
license: BSD-2-Clause

install: |
    configure \
        --disable-profiling \
        --enable-lto \
        --enable-suggestions \
        --disable-sanitizer \
        --disable-pedantic \
        --disable-werror \
        --disable-pdf-compression
