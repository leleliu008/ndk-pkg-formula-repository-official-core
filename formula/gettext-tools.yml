summary: GNU internationalization (i18n) and localization (l10n) library
src-url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
src-sha: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
license: GPL-3.0-or-later
dep-pkg: libncurses libunistring libxml2

fix-url: https://raw.githubusercontent.com/leleliu008/patches/refs/heads/master/gettext-1.0-fix-syntax-error.patch
fix-sha: fa6a95a0ad332150580257bf55d5575aadd71884a0cf6b180f071296586f83bb

dopatch: gsed -i -e '/ftello/d' -e '/fseeko/d' ../include/ndk-pkg-common.h

install: |
    configure \
        --without-included-libxml \
        --without-included-libunistring \
        --with-included-regex \
        --with-included-gettext \
        --with-libiconv-prefix=$libiconv_INSTALL_DIR \
        --with-libncurses-prefix=$libncurses_INSTALL_DIR \
        --disable-acl \
        --disable-openmp \
        --disable-csharp \
        --disable-java \
        --enable-c++ \
        --enable-curses \
        --enable-threads=posix \
        --enable-libasprintf \
        --enable-namespacing \
        --enable-nls \
        --enable-relocatable \
        gl_cv_header_working_fcntl_h=yes

dotweak: rm -rf include/ lib/
