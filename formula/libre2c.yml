summary: Generate C-based recognizers from regular expressions
web-url: https://re2c.org/
src-url: https://github.com/skvadrik/re2c/releases/download/4.6/re2c-4.6.tar.xz
src-sha: 75bf2696445e831d0d44e0d9f2909eeffc18c09757f222b2fb025f7e59fe130b
dep-upp: python3

install: |
    cmakew 2 \
        -DRE2C_BUILD_LIBS=ON \
        -DRE2C_BUILD_RE2GO=OFF \
        -DRE2C_BUILD_RE2RUST=OFF \
        -DRE2C_REBUILD_DOCS=OFF

dotweak: rm -rf bin/ share/man/
