summary: Successor of GNU Wget, a file and recursive website downloader
git-url: https://gitlab.com/gnuwget/wget2
src-url: https://ftp.gnu.org/gnu/wget/wget2-2.3.0.tar.gz
src-sha: 4f1915b2a55a789a15f2f9ada7cc44bca81418e648f76fd88a7f4dd028b2149f
license: GPL-3.0-or-later
dep-pkg: libz libbz2 liblzma libzstd lzlib libbrotli libnghttp2 libopenssl libpcre2 libpsl
dep-upp: texinfo doxygen

dopatch: |
    gsed -i -e '/ftello/d' -e '/fseeko/d' ../include/ndk-pkg-common.h

    { "$CC" -x c - <<EOF
    int main() {
        struct ArrayList {
            int size;
            int * p __attribute__((counted_by(size)));
        };
        return 0;
    }
    EOF
    } || gsed -i 's|_GL_ATTRIBUTE_COUNTED_BY [^;]*||' lib/hash.c

install: configure --with-ssl=openssl --with-bzip2 --with-lzma --without-gpgme --enable-static --disable-shared
