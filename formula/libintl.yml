summary: GNU internationalization (i18n) and localization (l10n) library
src-url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
src-sha: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
license: GPL-3.0-or-later
dep-pkg: libiconv
bscript: gettext-runtime

dopatch: gsed -i '262d' gnulib-lib/progreloc.c

install: |
    configure \
        --with-included-gettext \
        --with-libiconv-prefix="$libiconv_INSTALL_DIR" \
        --disable-openmp \
        --disable-csharp \
        --disable-java \
        --enable-c++ \
        --enable-nls \
        --enable-relocatable \
        --enable-threads=posix \
        --disable-libasprintf \
        gl_cv_header_working_fcntl_h=yes

dotweak: |
    writepc libintl <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libintl
    Description: National Language Support library
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lintl 
    Requires: libiconv
    EOF
