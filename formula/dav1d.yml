summary: AV1 decoder targeted to be small and fast
git-url: https://code.videolan.org/videolan/dav1d
src-url: https://code.videolan.org/videolan/dav1d/-/archive/1.5.5/dav1d-1.5.5.tar.bz2
src-sha: afc5378daba30eafd11d7b4f0ec863270d7b175f38393a2e1e0ff76f3a45c8b9
license: BSD-2-Clause
dep-upp: nasm

install: |
    mesonw \
        -Denable_asm=true \
        -Denable_tools=true \
        -Denable_tests=false \
        -Denable_examples=false

dotweak: rm -rf include/ lib/
