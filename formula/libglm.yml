summary: C++ mathematics library for graphics software
web-url: https://glm.g-truc.net/
src-url: https://github.com/g-truc/glm/archive/refs/tags/1.0.3.tar.gz
src-sha: 6775e47231a446fd086d660ecc18bcd076531cfedd912fbd66e576b118607001
license: MIT

install: cmakew 2 -DGLM_BUILD_TESTS=OFF

dotweak: |
    writepc glm <<EOF
    prefix=$PACKAGE_INSTALL_DIR
    includedir=\${prefix}/include

    Name: GLM
    Description: OpenGL Mathematics
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -lglm
    EOF
