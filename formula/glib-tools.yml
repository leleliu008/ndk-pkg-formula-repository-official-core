summary: A collection of tools for glib
web-url: https://developer.gnome.org/glib
git-url: https://github.com/GNOME/glib
src-url: https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz
src-sha: 93c941aa17d5eb1d53fe838365f29a8b4e539c222a256d974ec8f30fc413e396
license: LGPL-2.1-or-later
dep-pkg: libpcre2 libintl libffi libz
dep-upp: gettext-tools

dopatch: |
    gsed -i \
         -e "s|dependency('intl'|dependency('libintl'|" \
         -e "s|dependency('iconv')|dependency('libiconv')|" \
         meson.build

    # sys/stat.h:182:int lchmod(const char* _Nonnull __path, mode_t __mode) __INTRODUCED_IN(36);
    if [ "$TARGET_PLATFORM_VERS" -lt 36 ] ; then
        gsed -i "/lchmod/d" meson.build
    fi

install: |
    mesonw \
        -Dintrospection=disabled \
        -Ddocumentation=false \
        -Dman-pages=disabled \
        -Dsysprof=disabled \
        -Dselinux=disabled \
        -Ddtrace=disabled \
        -Dnls=disabled \
        -Dlibelf=disabled \
        -Dlibmount=disabled \
        -Dglib_debug=disabled \
        -Dglib_assert=false \
        -Dxattr=false \
        -Dtests=false \
        -Dinstalled_tests=false \
        -Dbsymbolic_functions=false

dotweak: rm -rf lib/ include/
