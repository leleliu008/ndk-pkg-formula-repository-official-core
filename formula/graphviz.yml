pkgtype: exe+lib
summary: An open source graph visualization software
web-url: https://www.graphviz.org/
git-url: https://gitlab.com/graphviz/graphviz
src-url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.0/graphviz-16.1.0.tar.xz
src-sha: 0f661718f3e5268dc3bad0fb53ab646605d26db70f4080799aff1dc2f61783c3
license: EPL-1.0
dep-pkg: libgd libpango libglob
dep-upp: gm4 flex bison gawk git python3 libtool

install: |
    configure \
        --disable-swig \
        --disable-php \
        --disable-tcl \
        --without-gdk \
        --without-gtk \
        --without-qt \
        --without-x
