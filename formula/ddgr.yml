summary: DuckDuckGo from the terminal
src-url: https://github.com/jarun/ddgr/archive/refs/tags/v2.2.tar.gz
src-sha: a858e0477ea339b64ae0427743ebe798a577c4d942737d8b3460bce52ac52524
license: GPL-3.0-or-later
install: |
    gmakew install PREFIX="$PACKAGE_INSTALL_DIR"
    mv auto-completion/bash/ddgr-completion.bash ddgr.bash
    mv auto-completion/zsh/_ddgr ddgr.zsh
    mv auto-completion/fish/ddgr.fish .
    install_files ddgr.*sh
