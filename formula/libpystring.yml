summary: C++ functions matching the interface and behavior of python string methods with std::string
src-url: https://github.com/imageworks/pystring/archive/refs/tags/v1.2.0.tar.gz
src-sha: 020a603a757ba1e429f4b1ea6feb3afbe0fb34bcafa355032e1f1b8a0019d198

install: |
    run $CXX -c $CXXFLAGS $CPPFLAGS -o pystring.o ../pystring.cpp
    run $CXX -shared $LDFLAGS -o libpystring.so pystring.o
    run $AR rsc libpystring.a pystring.o
    run install_incs ../pystring.h:pystring
    run install_libs libpystring.*
