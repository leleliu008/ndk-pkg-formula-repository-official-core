summary: Packet(TCP/IP) Capture library
git-url: https://github.com/the-tcpdump-group/libpcap
src-url: https://www.tcpdump.org/release/libpcap-1.11.1.tar.gz
src-sha: 7985b1d20ff82c1e384115038046e0b15034648c6f45c92e08601d4ee1b369ed
license: BSD-3-Clause
dep-upp: gm4 flex bison
dep-pkg: libopenssl

install: |
    cmakew \
        -DPCAP_TYPE=linux \
        -DENABLE_REMOTE=OFF \
        -DBDEBUG=OFF \
        -DDISABLE_NETMAP=OFF \
        -DDISABLE_DBUS=OFF \
        -DDISABLE_BLUETOOTH=OFF \
        -DDISABLE_DAG=ON \
        -DDISABLE_SNF=ON
