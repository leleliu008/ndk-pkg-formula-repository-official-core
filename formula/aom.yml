summary: command-line tools for encoding and decoding AV1 video streams
web-url: https://aomedia.googlesource.com/aom
src-url: https://storage.googleapis.com/aom-releases/libaom-3.15.3.tar.gz
src-sha: 12c01dc731ed7b5a999e28120b45bf58a002ba3435a4ba2cfbc1e084a27c9c04
license: BSD-2-Clause
dep-upp: nasm perl
dep-pkg: libvmaf

install: |
    cmakew \
        -DENABLE_DOCS=OFF \
        -DENABLE_TESTS=OFF \
        -DENABLE_TESTDATA=OFF \
        -DENABLE_TOOLS=ON \
        -DENABLE_EXAMPLES=ON \
        -DCONFIG_TUNE_VMAF=1 \
        -DCONFIG_RUNTIME_CPU_DETECT=0 \
        -DBUILD_SHARED_LIBS=OFF

dotweak: rm -rf include/ lib/
