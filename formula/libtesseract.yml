summary: OCR (Optical Character Recognition) engine
src-url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
src-sha: a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4
license: Apache-2.0
dep-pkg: libleptonica libcpu_features

dopatch: gsed -i '/TARGETS tesseract DESTINATION/d' CMakeLists.txt

install: |
    cmakew 2 \
        -DENABLE_LTO=OFF \
        -DDISABLE_ARCHIVE=ON \
        -DDISABLE_CURL=ON \
        -DUSE_SYSTEM_ICU=ON \
        -DOPENMP_BUILD=ON \
        -DLEPT_TIFF_RESULT=0 \
        -DBUILD_TESTS=OFF \
        -DBUILD_TRAINING_TOOLS=OFF
