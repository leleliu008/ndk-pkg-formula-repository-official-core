summary: OCR (Optical Character Recognition) engine
src-url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.5.tar.gz
src-sha: b02cf6f37cfc95be5bf7e4b2d39e51997b1ac41f7beb4e2bd16777bb67561c79
license: Apache-2.0
dep-pkg: libleptonica libcpu_features

dopatch: gsed -i '/TARGETS tesseract DESTINATION/d' CMakeLists.txt

install: |
    cmakew 2 \
        -DENABLE_LTO=OFF \
        -DDISABLE_ARCHIVE=ON \
        -DDISABLE_CURL=ON \
        -DUSE_SYSTEM_ICU=ON \
        -DOPENMP_BUILD=ON \
        -DLEPT_TIFF_RESULT=0 \
        -DBUILD_TESTS=OFF \
        -DBUILD_TRAINING_TOOLS=OFF
