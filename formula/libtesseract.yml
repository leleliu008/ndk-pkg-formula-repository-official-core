summary: OCR (Optical Character Recognition) engine
src-url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
src-sha: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884
license: Apache-2.0
dep-pkg: libleptonica libcpu_features

dopatch: gsed -i '/TARGETS tesseract DESTINATION/d' CMakeLists.txt

install: |
    cmakew 2 \
        -DENABLE_LTO=OFF \
        -DDISABLE_ARCHIVE=ON \
        -DDISABLE_CURL=ON \
        -DUSE_SYSTEM_ICU=ON \
        -DOPENMP_BUILD=ON \
        -DLEPT_TIFF_RESULT=0 \
        -DBUILD_TESTS=OFF \
        -DBUILD_TRAINING_TOOLS=OFF
