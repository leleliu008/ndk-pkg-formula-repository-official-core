summary: Linux virtual machines
web-url: https://lima-vm.io/
src-url: https://github.com/lima-vm/lima/archive/refs/tags/v2.3.0.tar.gz
src-sha: 436ace830cb3e8fa512e0157a220bd8d6f826aef789c3f26d2984f0ea1e3c2ea
license: Apache-2.0
bsystem: gmake go
install: |
    export CGO_ENABLED=1
    gmakew clean native VERSION="$PACKAGE_VERSION"
    install_bins _output/bin/*
    run cp -r _output/libexec _output/share "$PACKAGE_INSTALL_DIR"
