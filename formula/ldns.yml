summary: DNS library written in C
git-url: https://github.com/NLnetLabs/ldns
web-url: https://nlnetlabs.nl/projects/ldns/
src-url: https://nlnetlabs.nl/downloads/ldns/ldns-1.9.2.tar.gz
src-sha: b524fa21994b6e834200ceb8c27f1b84bda5982fe35706f058196c079db94d5d
license: BSD-3-Clause
dep-pkg: libpcap

parallel: 0

install: |
    configure \
        --with-drill \
        --with-examples \
        --with-ssl=$libopenssl_INSTALL_DIR \
        --without-pyldns \
        --disable-dane-verify LIBS="'-lssl -lcrypto'"
