summary: A compiler wrapper to speed up recompilation by caching previous compilations and detecting when the same compilation is being done again
web-url: https://ccache.dev
src-url: https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2.tar.xz
src-sha: 0feb2707d9cb48885abb950e5d629e85f57fa79a2439cbbdfa681d6c3dc5f0dc
license: GPL-3.0-or-later
dep-pkg: libhiredis libblake3 libxxhash libzstd libfmt libposix_spawn

dopatch: |
    gsed -i '/add_subdirectory(blake3)/d' src/third_party/CMakeLists.txt

install: |
    cmakew \
        -DDEPS=LOCAL \
        -DENABLE_COVERAGE=OFF \
        -DENABLE_CPPCHECK=OFF \
        -DENABLE_IPO=OFF \
        -DENABLE_TRACING=OFF \
        -DENABLE_TESTING=OFF \
        -DWARNINGS_AS_ERRORS=OFF \
        -DZSTD_FROM_INTERNET=OFF
