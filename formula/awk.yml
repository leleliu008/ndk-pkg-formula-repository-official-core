summary: Text processing scripting language
web-url: https://www.cs.princeton.edu/~bwk/btl.mirror/
src-url: https://github.com/onetrueawk/awk/archive/refs/tags/20261106.tar.gz
src-sha: 1b354fe6fa0089a959ef912085e7a064236d15a7d3c9e6ce86456c3b87d3f464
license: SMLNJ
dep-upp: gm4 bison

dopatch: |
    gsed -i \
         -e 's|$(HOSTCC) $(CFLAGS)|$(HOSTCC) $(HOSTCFLAGS)|' \
         -e 's|-lm|$(LDFLAGS) -lm|' makefile

install: |
    gmakew clean
    gmakew CC="$CC" CFLAGS="'$CFLAGS'" HOSTCC="$CC_FOR_BUILD" HOSTCFLAGS="'$CFLAGS_FOR_BUILD $CPPFLAGS_FOR_BUILD'"
    mv a.out awk
    install_bins awk
    install_mans awk.1
