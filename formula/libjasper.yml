summary: Library for manipulating JPEG-2000 images
web-url: https://ece.engr.uvic.ca/~frodo/jasper/
src-url: https://github.com/jasper-software/jasper/releases/download/version-4.2.9/jasper-4.2.9.tar.gz
src-sha: f71cf643937a5fcaedcfeb30a22ba406912948ad4413148214df280afc425454
license: JasPer-2.0
dep-pkg: libjpeg-turbo

install: |
    cmakew \
        -DALLOW_IN_SOURCE_BUILD=ON \
        -DJAS_ENABLE_DOC=OFF \
        -DJAS_ENABLE_SHARED=OFF \
        -DJAS_ENABLE_PROGRAMS=OFF \
        -DJAS_STDC_VERSION=$("$CC" -E -dM - < /dev/null | sed -n '/__STDC_VERSION__/p' | cut -d ' ' -f3)
    cmakew \
        -DALLOW_IN_SOURCE_BUILD=ON \
        -DJAS_ENABLE_DOC=OFF \
        -DJAS_ENABLE_SHARED=ON \
        -DJAS_ENABLE_PROGRAMS=OFF \
        -DJAS_STDC_VERSION=$("$CC" -E -dM - < /dev/null | sed -n '/__STDC_VERSION__/p' | cut -d ' ' -f3)
