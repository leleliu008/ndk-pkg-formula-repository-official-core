summary: Monitor data progress through a pipe
web-url: https://www.ivarch.com/programs/pv.shtml
src-url: https://www.ivarch.com/programs/sources/pv-1.12.7.tar.gz
src-sha: 5326ed7ee95ef18039390c0b17891ac28985ac7c7a4235070fab767c1fe37bd8
license: Artistic-2.0
dep-pkg: libncurses

dopatch: |
    if [ "$TARGET_PLATFORM_VERS" -lt 34 ] ; then
        cat > copy_file_range.c <<EOF
    #include <sys/syscall.h>
    static inline ssize_t copy_file_range(int __fd_in, off64_t* _Nullable __off_in, int __fd_out, off64_t* _Nullable __off_out, size_t __length, unsigned int __flags) {
        return syscall(__NR_copy_file_range, __fd_in, __off_in, __fd_out, __off_out, __length, __flags); }
    EOF
        gsed -i '/sys\/time\.h/r copy_file_range.c' src/pv/transfer.c
    fi

prepare: |
    unset CONFIGURE_EXTRA_ARGS

    # sys/shm.h  int shmctl(int __shm_id, int __op, struct shmid_ds* _Nullable __buf) __INTRODUCED_IN(26);
    if [ "$TARGET_PLATFORM_VERS" -lt 26 ] ; then
        CONFIGURE_EXTRA_ARGS='--disable-ipc'
    fi

install: configure -enable-copy-file-range --disable-nls --disable-static ac_cv_func_copy_file_range=yes $CONFIGURE_EXTRA_ARGS
