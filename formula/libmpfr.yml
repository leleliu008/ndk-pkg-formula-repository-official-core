summary: C library for multiple-precision floating-point computations
web-url: https://www.mpfr.org
git-url: https://gitlab.inria.fr/mpfr/mpfr
src-url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
src-sha: b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01
license: LGPL-3.0-or-later
dep-pkg: libgmp

install: |
    configure \
        --with-pic \
        --with-gmp="$libgmp_INSTALL_DIR" \
        --disable-logging \
        --disable-assert \
        --disable-lto \
        --enable-warnings
