summary: A secure, fast, compliant, and very flexible web server that has been optimized for high-performance environments
web-url: https://www.lighttpd.net/
src-url: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.85.tar.xz
src-sha: 18de51b393bac4a6827879e1a7ff377c169e414bae92cd245091d80fc2601d13
license: BSD-3-Clause
dep-pkg: libopenssl libz libbz2 libpcre2 libglob
dep-upp: libtool
bsystem: autogen

dopatch: gsed -i '/define MAX_WRITE_LIMIT/a \#include<linux/fs.h>' src/chunk.h

install: |
    configure \
        --with-openssl \
        --with-zlib \
        --with-bzip2 \
        --with-pcre2 \
        --without-pcre LIBS=-ldl
