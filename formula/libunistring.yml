summary: C library for manipulating Unicode strings
src-url: https://ftp.gnu.org/gnu/libunistring/libunistring-1.5.tar.gz
src-sha: 5b0ecd46cbf225375f20ab4056197e66a7ac590e2684c069af407ae3383c9d81
license: GPL-2.0-or-later
dep-pkg: libiconv

install: |
    configure \
        --with-libiconv-prefix="$libiconv_INSTALL_DIR" \
        --enable-threads=posix \
        --enable-relocatable \
        --enable-namespacing

dotweak: |
    writepc libunistring <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libunistring
    Description: $PACKAGE_SUMMARY
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lunistring
    Requires: libiconv
    EOF
