summary: Implementation of the DNS protocols
web-url: https://www.isc.org/downloads/bind
git-url: https://github.com/isc-projects/bind9
src-url: https://downloads.isc.org/isc/bind9/9.20.30/bind-9.20.30.tar.xz
src-sha: 9e1443a40a72a30272cbc3196d020a6b2e26937111c83e59e101e82e1e3b4fef
license: MPL-2.0
dep-pkg: libopenssl libnghttp2 libjson-c libxml2 libidn2 liburcu libcap libuv libglob
dep-upp: perl

dopatch: find lib -name 'Makefile.in' -exec gsed -i 's|-release "$(PACKAGE_VERSION)"||' {} +

install: |
    configure \
        --disable-linux-caps \
        --disable-static \
        --enable-shared \
        --without-python \
        --without-gssapi \
        --without-lmdb \
        --with-zlib \
        --with-json-c \
        --with-libxml2 \
        --with-libidn2="$libidn2_INSTALL_DIR" \
        --with-openssl="$libopenssl_INSTALL_DIR" \
        ac_cv_search_idn2_to_ascii_lz="'-lidn2 -lunistring -liconv'"

# int getifaddrs(struct ifaddrs** __list_ptr) __INTRODUCED_IN(24);
# void freeifaddrs(struct ifaddrs* __ptr) __INTRODUCED_IN(24);
# void endpwent(void) __INTRODUCED_IN(26);
api-min: 26
