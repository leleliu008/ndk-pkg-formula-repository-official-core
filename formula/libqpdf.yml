summary: C++ library that performs content-preserving transformations on PDF files
src-url: https://github.com/qpdf/qpdf/releases/download/v12.4.2/qpdf-12.4.2.tar.gz
src-sha: 8a58af5b6141319287c1883bec8bd1bd545b7567b7fc5e6ce5d25a1c85f36397
license: Apache-2.0
dep-pkg: libjpeg-turbo libopenssl libz

# https://qpdf.readthedocs.io/en/stable/installation.html
install: |
    cmakew \
        -DINSTALL_MANUAL=OFF \
        -DINSTALL_EXAMPLES=OFF \
        -DINSTALL_PKGCONFIG=ON \
        -DINSTALL_CMAKE_PACKAGE=ON \
        -DBUILD_DOC=OFF \
        -DBUILD_SHARED_LIBS=ON \
        -DBUILD_STATIC_LIBS=ON \
        -DUSE_IMPLICIT_CRYPTO=OFF \
        -DREQUIRE_CRYPTO_OPENSSL=ON\
        --targets=libqpdf,libqpdf_static \
        --components=lib,dev
