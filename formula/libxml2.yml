summary: GNOME XML library
src-url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
src-sha: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
license: MIT
dep-pkg: libiconv libz

install: |
    configure \
        --with-legacy \
        --with-iconv="$libiconv_INSTALL_DIR" \
        --with-http \
        --with-zlib \
        --without-lzma \
        --without-python \
        --without-readline \
        --without-coverage \
        --without-debug \
        --enable-ipv6

dotweak: gsed -i -e '/^Requires/s|$| libiconv|' -e 's|-liconv|-ldl|g' lib/pkgconfig/libxml-2.0.pc
