summary: Nanomsg-next-generation -- light-weight brokerless messaging
web-url: https://nng.nanomsg.org
src-url: https://github.com/nanomsg/nng/archive/refs/tags/v2.0.0.tar.gz
src-sha: 439241ca7afd059e2c5635491e430e37b591430c25aa57c0ba07995c3fbdffa6
license: MIT
dep-pkg: mbedtls

dopatch2: |
    if [ "$TARGET_PLATFORM_VERS" -ge 24 ] ; then
        gsed -i '/NNG_HAVE_LOCKF/c set(NNG_HAVE_LOCKF TRUE)'  src/platform/posix/CMakeLists.txt
    else
        gsed -i '/NNG_HAVE_LOCKF/c set(NNG_HAVE_LOCKF FALSE)' src/platform/posix/CMakeLists.txt
    fi

install: |
    cmakew 2 \
        -DNNG_TESTS=OFF \
        -DNNG_ENABLE_TLS=ON \
        -DNNG_ENABLE_HTTP=ON
