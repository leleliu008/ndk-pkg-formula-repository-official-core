summary: A text-based web browser
web-url: https://invisible-island.net/lynx/
src-url: https://invisible-mirror.net/archives/lynx/tarballs/lynx2.9.3.tar.bz2
src-sha: 174b7f2866a60f3247ba75f5c7dbb10b124aede4a1359312de15f3bfebd2050f
version: 2.9.3
license: GPL-2.0-or-later
dep-pkg: libopenssl libncurses libbz2 libz
dep-upp: libopenssl

dopatch: gsed -i 's|cf_ok_build_cc=unknown|cf_ok_build_cc=yes|' configure

install: |
    configure \
        --with-build-cc="'$CC_FOR_BUILD'" \
        --with-build-cpp="'$CPP_FOR_BUILD'" \
        --with-build-cppflags="'$CPPFLAGS_FOR_BUILD'" \
        --with-build-cflags="'$CFLAGS_FOR_BUILD'" \
        --with-build-ldflags="'$LDFLAGS_FOR_BUILD'" \
        --with-screen=ncursesw \
        --with-curses-dir=$libncurses_INSTALL_DIR \
        --with-zlib \
        --with-bzlib \
        --with-ssl \
        --without-x \
        --without-gnutls \
        --without-socks \
        --without-socks5 \
        --enable-echo \
        --enable-warnings \
        --enable-ipv6 \
        --enable-ftp \
        --disable-trace \
        ac_cv_func_cuserid=no
