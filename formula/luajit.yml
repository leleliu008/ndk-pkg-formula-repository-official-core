summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/96f7b297326e9fd454b7186c6858b2773f94a0dc.tar.gz
src-sha: ce9d03b33e4c28492e8dacacf69c6975a0502cf9225957a6b42dc28f92cbbd34
version: 2.1.1795119671
license: MIT

prepare: |
    if [ "$TARGET_PLATFORM_NBIT" = 32 ] ; then
        if [ "$NATIVE_PLATFORM_LIBC" = glibc ] ; then
            cat > zig-cc <<EOF
    #!/bin/sh
    unset CC CXX LD AS
    set -ex
    exec "$ZIG" cc "\$@" --target=x86-linux-musl
    EOF
            chmod +x zig-cc
            CC_FOR_BUILD="$PWD/zig-cc"
        fi
    fi

install: |
    gmakew clean amalg \
        HOST_SYS=$(uname -s) \
        HOST_CC="$CC_FOR_BUILD" \
        HOST_LD="$CC_FOR_BUILD" \
        HOST_CFLAGS="'$CPPFLAGS_FOR_BUILD $CFLAGS_FOR_BUILD'" \
        HOST_LDFLAGS="'$LDFLAGS_FOR_BUILD'" \
        CFLAGS= \
        LDFLAGS= \
        TARGET_SYS=Linux \
        TARGET_CFLAGS="'$CPPFLAGS $CFLAGS'" \
        TARGET_LDFLAGS="'$LDFLAGS'" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP="$STRIP" \
        STATIC_CC="$CC" \
        DYNAMIC_CC="'$CC -fPIC'" \
        Q=
    install_files src/luajit

developer: Mike Pall <luajit@freelists.org>
