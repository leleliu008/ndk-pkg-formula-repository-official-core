summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/ea9eb7edb5eac4a9d175d74523db34fac0fa5180.tar.gz
src-sha: 338a5640be00b89fd0a2a027a7433fcbbb4d006be840d216d84151386b5bcdf7
version: 2.1.1793383622
license: MIT

prepare: |
    if [ "$TARGET_PLATFORM_NBIT" = 32 ] ; then
        if [ "$NATIVE_PLATFORM_LIBC" = glibc ] ; then
            cat > zig-cc <<EOF
    #!/bin/sh
    unset CC CXX LD AS
    set -ex
    exec "$ZIG" cc "\$@" --target=x86-linux-musl
    EOF
            chmod +x zig-cc
            CC_FOR_BUILD="$PWD/zig-cc"
        fi
    fi

install: |
    gmakew clean amalg \
        HOST_SYS=$(uname -s) \
        HOST_CC="$CC_FOR_BUILD" \
        HOST_LD="$CC_FOR_BUILD" \
        HOST_CFLAGS="'$CPPFLAGS_FOR_BUILD $CFLAGS_FOR_BUILD'" \
        HOST_LDFLAGS="'$LDFLAGS_FOR_BUILD'" \
        CFLAGS= \
        LDFLAGS= \
        TARGET_SYS=Linux \
        TARGET_CFLAGS="'$CPPFLAGS $CFLAGS'" \
        TARGET_LDFLAGS="'$LDFLAGS'" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP="$STRIP" \
        STATIC_CC="$CC" \
        DYNAMIC_CC="'$CC -fPIC'" \
        Q=
    install_bins src/luajit

developer: Mike Pall <luajit@freelists.org>
