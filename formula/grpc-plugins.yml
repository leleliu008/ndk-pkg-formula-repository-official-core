summary: grpc plugins
web-url: https://grpc.io
src-url: https://github.com/grpc/grpc/archive/refs/tags/v1.83.0.tar.gz
src-sha: 90d453393a9d41215df546103b10b33b9566df79cdf6f49dc67f6c4d044d090d
license: Apache-2.0
dep-pkg: libprotobuf libopenssl libcares libre2
dep-upp: grpc-plugins
linkage: shared

dopatch: gsed -i '/issuer = X509_CRL_get_issuer(crl)/c const auto * issuer = X509_CRL_get_issuer(crl)' src/core/credentials/transport/tls/grpc_tls_crl_provider.cc

install: |
    cmakew \
        -DCMAKE_CXX_STANDARD=17 \
        -DCMAKE_CXX_STANDARD_REQUIRED=TRUE \
        -DgRPC_ABSL_PROVIDER=package \
        -DgRPC_CARES_PROVIDER=package \
        -DgRPC_PROTOBUF_PROVIDER=package \
        -DgRPC_SSL_PROVIDER=package \
        -DgRPC_ZLIB_PROVIDER=package \
        -DgRPC_RE2_PROVIDER=package \
        -DgRPC_INSTALL=ON \
        -DgRPC_BUILD_TESTS=OFF \
        -DgRPC_BUILD_GRPC_CPP_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_PHP_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_NODE_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_RUBY_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_PYTHON_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_CSHARP_PLUGIN=ON \
        -DgRPC_BUILD_GRPC_OBJECTIVE_C_PLUGIN=ON \
        -DBUILD_SHARED_LIBS=OFF \
        -DPROTOBUF_PROTOC_EXECUTABLE="$(command -v protoc)"

dotweak: rm -rf include/ lib/
