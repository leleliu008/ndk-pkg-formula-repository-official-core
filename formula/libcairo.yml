summary: Vector graphics library with cross-device output support
git-url: https://gitlab.freedesktop.org/cairo/cairo
src-url: https://cairographics.org/releases/cairo-1.18.6.tar.xz
src-sha: 1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4
license: LGPL-2.1-or-later MPL-1.1
dep-pkg: glib liblzo libpixman libfontconfig libexecinfo

install: |
    mesonw \
        -Dtests=disabled \
        -Dpng=enabled \
        -Dzlib=enabled \
        -Dglib=enabled \
        -Dtee=disabled \
        -Dfreetype=enabled \
        -Dfontconfig=enabled
