summary: GNU File, Shell, and Text utilities
git-url: https://github.com/coreutils/coreutils
src-url: https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz
src-sha: a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210
license: GPL-3.0-or-later

prepare: |
    export CPPFLAGS="$CPPFLAGS -D__USE_FORTIFY_LEVEL=0"

    if [ "$TARGET_PLATFORM_ARCH" = 'aarch64' ] ; then
        export CPPFLAGS="$CPPFLAGS -DSYS_getdents=61"
    fi

    export FORCE_UNSAFE_CONFIGURE=1

install: |
    configure \
        --with-included-regex \
        --with-linux-crypto \
        --without-libgmp \
        --without-openssl \
        --without-selinux \
        --disable-libcap \
        --disable-libsmack \
        --disable-assert \
        --disable-gcc-warnings \
        --disable-acl \
        --enable-xattr \
        --enable-threads=posix

# void endgrent(void) __INTRODUCED_IN(26);
api-min: 26
