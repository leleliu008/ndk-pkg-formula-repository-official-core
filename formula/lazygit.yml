summary: A simple terminal UI for git commands
src-url: https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.66.3.tar.gz
src-sha: 49e80d28e03e53048105f6ebb5afefbe5caacffa8549347d8a59eab3a00dafe1
license: MIT
install: |
    gow \
        -mod vendor \
        -X main.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        -X main.version=$PACKAGE_VERSION \
        -X main.buildSource=ndk-pkg
