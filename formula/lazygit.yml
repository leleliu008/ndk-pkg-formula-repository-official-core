summary: A simple terminal UI for git commands
src-url: https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.66.2.tar.gz
src-sha: fcaad0909af765ef87bd873164a4de78435515ab4d8b04f58d6ad51e8ecd00e5
license: MIT
install: |
    gow \
        -mod vendor \
        -X main.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        -X main.version=$PACKAGE_VERSION \
        -X main.buildSource=ndk-pkg
