summary: C++ library for parsing, formatting, and validating international phone numbers
src-url: https://github.com/google/libphonenumber/archive/refs/tags/v9.0.42.tar.gz
src-sha: 08cacf996f8d4a939bff5487bce6fbddb572acee358a44cb9031aa81d25cecd5
dep-pkg: boost libprotobuf googletest
license: Apache-2.0
bscript: cpp

install: |
    cmakew \
        -DCMAKE_CXX_STANDARD=17 \
        -DREGENERATE_METADATA=OFF \
        -DBUILD_GEOCODER=OFF \
        -DBUILD_STATIC_LIB=ON \
        -DUSE_POSIX_THREAD=ON \
        -DUSE_ICU_REGEXP=ON \
        -DUSE_BOOST=ON \
        -DUSE_RE2=OFF
