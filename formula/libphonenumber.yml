summary: C++ library for parsing, formatting, and validating international phone numbers
src-url: https://github.com/google/libphonenumber/archive/refs/tags/v9.0.41.tar.gz
src-sha: 5a5021295990c7ec36c639ab1b0e24ef54faa5571ba1cabcd59fa034563aad4d
dep-pkg: boost libprotobuf googletest
license: Apache-2.0
bscript: cpp

install: |
    cmakew \
        -DCMAKE_CXX_STANDARD=17 \
        -DREGENERATE_METADATA=OFF \
        -DBUILD_GEOCODER=OFF \
        -DBUILD_STATIC_LIB=ON \
        -DUSE_POSIX_THREAD=ON \
        -DUSE_ICU_REGEXP=ON \
        -DUSE_BOOST=ON \
        -DUSE_RE2=OFF
