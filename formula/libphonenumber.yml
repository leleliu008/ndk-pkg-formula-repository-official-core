summary: C++ library for parsing, formatting, and validating international phone numbers
src-url: https://github.com/google/libphonenumber/archive/refs/tags/v9.0.43.tar.gz
src-sha: bea4c2afec1fd43f4a7b3bda7b00dc99392ba1345dddd147059856889d174248
dep-pkg: boost libprotobuf googletest
license: Apache-2.0
bscript: cpp

install: |
    cmakew \
        -DCMAKE_CXX_STANDARD=17 \
        -DREGENERATE_METADATA=OFF \
        -DBUILD_GEOCODER=OFF \
        -DBUILD_STATIC_LIB=ON \
        -DUSE_POSIX_THREAD=ON \
        -DUSE_ICU_REGEXP=ON \
        -DUSE_BOOST=ON \
        -DUSE_RE2=OFF
