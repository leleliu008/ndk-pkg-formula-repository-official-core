summary: A command-line tool that allows you to perform DNS lookups
web-url: https://c-ares.org/
src-url: https://github.com/c-ares/c-ares/releases/download/v1.34.8/c-ares-1.34.8.tar.gz
src-sha: c222b6d681096f9444d2c4863d2c1174019e27cacca0a4a5c114d36dd7d7bf78
license: MIT
install: |
    cmakew \
        -DCARES_INSTALL=ON \
        -DCARES_SHARED=OFF \
        -DCARES_STATIC=ON \
        -DCARES_STATIC_PIC=ON \
        -DCARES_BUILD_TOOLS=ON \
        -DCARES_BUILD_TESTS=OFF

dotweak: rm -rf include/ lib/ share/man/man3/
