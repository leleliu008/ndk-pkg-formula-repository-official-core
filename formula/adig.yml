summary: A command-line tool that allows you to perform DNS lookups
web-url: https://c-ares.org/
src-url: https://github.com/c-ares/c-ares/releases/download/v1.34.9/c-ares-1.34.9.tar.gz
src-sha: 9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f
license: MIT
install: |
    cmakew \
        -DCARES_INSTALL=ON \
        -DCARES_SHARED=OFF \
        -DCARES_STATIC=ON \
        -DCARES_STATIC_PIC=ON \
        -DCARES_BUILD_TOOLS=ON \
        -DCARES_BUILD_TESTS=OFF

dotweak: rm -rf include/ lib/ share/man/man3/
