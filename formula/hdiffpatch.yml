summary: A command-line tools for diff & patch
src-url: https://github.com/sisong/HDiffPatch/archive/refs/tags/v5.1.3.tar.gz
src-sha: 435c46447e7a1ace0327b67da2ec50a06e7f02d19960a182b493ff2e3f91c2b0
license: MIT

prepare: |
    cd ..

    for item in libmd5 xxHash bzip2 lzma zstd zlib libdeflate
    do
        run git clone --depth=1 "https://github.com/sisong/$item"
    done

install: |
    gmakew clean
    gmakew ZSTD=1 LZMA=1 ZLIB=1 BZIP2=1 LDEF=1 MD5=1 XXH=1 CC="$CC" PATCH_LINK="'$LDFLAGS'" DIFF_LINK="'$LDFLAGS'"
    install_bins hdiffz hpatchz
