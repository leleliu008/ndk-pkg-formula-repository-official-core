summary: Open Source H.264 Codec
src-url: https://github.com/cisco/openh264/archive/refs/tags/v2.7.0.tar.gz
src-sha: 5178775c8b440073e70920e97d195efff721c0e56d0a78cc82c919e95d54924d
license: BSD-2-Clause
dep-upp: nasm
install: mesonw -Dtests=disabled

prepare: |
    if [ "$TARGET_PLATFORM_ARCH" = 'i686' ] ; then
        NASM="$(command -v nasm)"

        cat > ../bin/nasm <<EOF
    #!/bin/sh
    exec "$NASM" -DX86_32_PICASM "\$@"
    EOF
        chmod +x ../bin/nasm
    fi
