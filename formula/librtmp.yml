summary: C library for downloading RTMP streaming media
web-url: https://rtmpdump.mplayerhq.hu
git-url: https://git.ffmpeg.org/rtmpdump
git-tag: v2.6
license: GPL-2.0-or-later
dep-pkg: libz libopenssl

parallel: 0

install: |
    gmakew -C librtmp clean   SYS=posix
    gmakew -C librtmp         SYS=posix CC="$CC" LD="$LD" AR="$AR" OPT= XCFLAGS="'$CFLAGS $CPPFLAGS'" XLDFLAGS="'$LDFLAGS'"
    gmakew -C librtmp install SYS=posix prefix="$PACKAGE_INSTALL_DIR"
