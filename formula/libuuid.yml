summary: DCE compatible Universally Unique Identifier library
git-url: https://github.com/util-linux/util-linux
src-url: https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz
src-sha: fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec
license: GPL-2.0-or-later
dep-upp: automake libtool

install: |
    configure \
        --without-python \
        --without-systemd \
        --enable-widechar \
        --enable-libuuid \
        --disable-all-programs \
        --disable-bash-completion \
        --disable-use-tty-group \
        --disable-chfn-chsh \
        --disable-login \
        --disable-su \
        --disable-runuser \
        --disable-makeinstall-chown \
        --disable-makeinstall-setuid

dotweak: rm -rf bin/ sbin/ share/man/man[158]/
