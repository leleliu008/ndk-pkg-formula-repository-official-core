summary: Implementation of iCalendar protocols and data formats
web-url: https://libical.github.io/libical
src-url: https://github.com/libical/libical/releases/download/v4.0.7/libical-4.0.7.tar.gz
src-sha: 47c05bc96e41416578cf1803bb2ba3f8d292cb17d5ac2fca539dee922bae8a94
license: LGPL-2.1-or-later
dep-pkg: libicu libxml2
dep-upp: perl

prepare: export ICU_ROOT="$libicu_INSTALL_DIR"

# https://github.com/libical/libical/wiki/For-the-Users:-Cross-compiling
install: |
    cmakew \
        -DLIBICAL_STATIC=ON \
        -DLIBICAL_GLIB=OFF \
        -DLIBICAL_GLIB_VAPI=OFF \
        -DLIBICAL_GLIB_BUILD_DOCS=OFF \
        -DLIBICAL_CXX_BINDINGS=ON \
        -DLIBICAL_JAVA_BINDINGS=OFF \
        -DLIBICAL_BUILD_DOCS=OFF \
        -DLIBICAL_BUILD_TESTING=OFF \
        -DLIBICAL_BUILD_EXAMPLES=OFF \
        -DLIBICAL_ENABLE_BUILTIN_TZDATA=OFF \
        -DLIBICAL_GOBJECT_INTROSPECTION=OFF \
        -DCMAKE_DISABLE_FIND_PACKAGE_BerkeleyDB=ON
