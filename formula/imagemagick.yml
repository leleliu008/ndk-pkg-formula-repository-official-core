pkgtype: exe+lib
summary: Tools and libraries to manipulate images in many formats
web-url: https://imagemagick.org/
src-url: https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-36/ImageMagick-7.1.2-36.7z
src-sha: a954685c1272e629cae8c546338309430851fee0878a7c3d7b9eaa5f6efb495c
version: 7.1.2.36
license: ImageMagick
dep-pkg: ghostscript libheif liblqr libltdl

dopatch: gsed -i -e '/ftello/d' -e '/fseeko/d' ../include/ndk-pkg-common.h

install: |
    configure \
        --with-freetype=yes \
        --with-gvc=no \
        --with-modules \
        --with-openjp2 \
        --with-openexr \
        --with-webp=yes \
        --with-heic=yes \
        --with-gslib \
        --with-pango \
        --with-lqr \
        --without-x \
        --without-wmf \
        --without-fftw \
        --disable-opencl LIBS=-lc++

dotweak: gsed -i 's|-lm|-lomp|' lib/pkgconfig/ImageMagick.pc
