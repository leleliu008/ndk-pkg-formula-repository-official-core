pkgtype: exe+lib
summary: Tools and libraries to manipulate images in many formats
web-url: https://imagemagick.org/
src-url: https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-35/ImageMagick-7.1.2-35.7z
src-sha: 1d95f7d0ed11e91a3ee9e3042a8e248cb88c666dd9256ab14cc871b1f73138fd
version: 7.1.2.35
license: ImageMagick
dep-pkg: ghostscript libheif liblqr libltdl

dopatch: gsed -i -e '/ftello/d' -e '/fseeko/d' ../include/ndk-pkg-common.h

install: |
    configure \
        --with-freetype=yes \
        --with-gvc=no \
        --with-modules \
        --with-openjp2 \
        --with-openexr \
        --with-webp=yes \
        --with-heic=yes \
        --with-gslib \
        --with-pango \
        --with-lqr \
        --without-x \
        --without-wmf \
        --without-fftw \
        --disable-opencl LIBS=-lc++

dotweak: gsed -i 's|-lm|-lomp|' lib/pkgconfig/ImageMagick.pc
