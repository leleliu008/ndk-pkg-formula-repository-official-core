summary: Clone of cat(1) with syntax highlighting and Git integration
src-url: https://github.com/sharkdp/bat/archive/refs/tags/v0.26.1.tar.gz
src-sha: 4474de87e084953eefc1120cf905a79f72bbbf85091e30cf37c9214eafcaa9c9
license: Apache-2.0
dep-pkg: libz

install: |
    cargow install

    run cd "target/$RUST_TARGET/$PROFILE/build"

    MAN1PATH="$(find . -name 'bat.1')"

    install_mans "$MAN1PATH"

    run cd "${MAN1PATH%'/manual/bat.1'}/completions"

    install_completion bash bat bat.bash
    install_completion fish bat bat.fish
    install_completion  zsh bat bat.zsh


# sys/sysinfo.h:68:int get_nprocs(void) __INTRODUCED_IN(23);
api-min: 23
