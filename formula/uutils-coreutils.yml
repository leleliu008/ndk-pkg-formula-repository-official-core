summary: rust implementation of the GNU coreutils
web-url: https://uutils.github.io/coreutils/
src-url: https://github.com/uutils/coreutils/archive/refs/tags/0.12.0.tar.gz
src-sha: 4fb327655cb4ffcbf2f16550cf9234079ffe839692f7aa1a6eda104af684e122
license: MIT
bsystem: gmake cargo

prepare: |
    cat > missing.c <<EOF
    #include <sys/syscall.h>
    #include <unistd.h>

    int sethostname(const char* _Nonnull __name, size_t __n) {
        return syscall(SYS_sethostname, __name, __n);
    }
    EOF

    run "$CC" -c "$CFLAGS" missing.c
    run "$AR" crs libandroid-missing.a missing.o

    export RUSTFLAGS="$RUSTFLAGS -Clink-arg=$PWD/libandroid-missing.a"

    [ "$TERMUX" = 1 ] || run rustup target add "$RUST_TARGET"

install: |
    gmakew clean
    gmakew install PREFIX="$PACKAGE_INSTALL_DIR" PROFILE="$PROFILE" CARGOFLAGS="--target=$RUST_TARGET" BUILDDIR="$PWD/target/$RUST_TARGET/$PROFILE" SKIP_UTILS="'uptime users pinky who hostid stdbuf'" LN="'ln -sf'" MULTICALL=y COMPLETIONS=n MANPAGES=n
