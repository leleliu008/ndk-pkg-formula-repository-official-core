summary: Multi-format archive and compression library
git-url: https://github.com/libarchive/libarchive
src-url: https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz
src-sha: a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2
license: BSD-2-Clause
dep-pkg: liblz4 liblzo libzstd liblzma libbz2 libz libiconv libexpat libopenssl

install: |
    cmakew \
        -DENABLE_TEST=OFF \
        -DENABLE_ACL=ON \
        -DENABLE_XATTR=ON \
        -DENABLE_TAR=OFF \
        -DENABLE_CAT=OFF \
        -DENABLE_CPIO=OFF \
        -DENABLE_UNZIP=OFF \
        -DENABLE_TAR_SHARED=OFF \
        -DENABLE_CAT_SHARED=OFF \
        -DENABLE_CPIO_SHARED=OFF \
        -DENABLE_UNZIP_SHARED=OFF \
        -DENABLE_CNG=OFF \
        -DENABLE_LIBB2=OFF \
        -DENABLE_NETTLE=OFF \
        -DENABLE_MBEDTLS=OFF \
        -DENABLE_LIBXML2=OFF \
        -DENABLE_LZ4=ON \
        -DENABLE_LZO=ON \
        -DENABLE_ZLIB=ON \
        -DENABLE_LZMA=ON \
        -DENABLE_ZSTD=ON \
        -DENABLE_BZip2=ON \
        -DENABLE_ICONV=ON \
        -DENABLE_EXPAT=ON \
        -DENABLE_OPENSSL=ON \
        -DENABLE_INSTALL=ON \
        -DBUILD_SHARED_LIBS=ON
