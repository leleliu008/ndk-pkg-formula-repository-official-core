summary: Cross-platform make
web-url: https://www.cmake.org/
src-url: https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5.tar.gz
src-sha: a0c54c88abb8078dd8eccadb717fc6bb194bf18e7d44c86309910288886e04e2
license: BSD-3-Clause
dep-pkg: libarchive libcurl libuv libjsoncpp librhash libncurses liblanginfo
dep-lib: libarchive libcurl

# https://github.com/termux/termux-packages/blob/master/packages/cmake/Source-CmakeLists.txt.patch
dopatch: gsed -i '1328c if (ANDROID)' Source/CMakeLists.txt

install: |
    cmakew \
        -DBUILD_QtDialog=OFF \
        -DBUILD_CursesDialog=ON \
        -DCMake_BUILD_LTO=ON \
        -DCMAKE_USE_OPENSSL=ON \
        -DCMAKE_USE_SYSTEM_CURL=ON \
        -DCMAKE_USE_SYSTEM_EXPAT=ON \
        -DCMAKE_USE_SYSTEM_FORM=ON \
        -DCMAKE_USE_SYSTEM_JSONCPP=ON \
        -DCMAKE_USE_SYSTEM_LIBARCHIVE=ON \
        -DCMAKE_USE_SYSTEM_LIBRHASH=ON \
        -DCMAKE_USE_SYSTEM_LIBUV=ON \
        -DCMAKE_USE_SYSTEM_ZLIB=ON

# keep in sync with libuv
api-min: 24
