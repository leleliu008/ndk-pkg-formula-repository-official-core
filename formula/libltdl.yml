summary: A small library aims at hiding the various difficulties of dlopening libraries from programmers
src-url: https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz
src-sha: 2ef1067c16c97db930fd740cc9bc3d3ba9a583804ae5ac42cc3e8719e49e191e
license: GPL-2.0-or-later
dep-upp: gm4
bscript: libltdl
install: configure --enable-ltdl-install

dotweak: |
    writepc libltdl <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libltdl
    Description: $PACKAGE_SUMMARY
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lltdl -ldl
    EOF
