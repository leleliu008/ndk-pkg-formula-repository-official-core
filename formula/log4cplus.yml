pkgtype: lib
summary: A simple-to-use, log4j-like logging framework for C++
src-url: https://github.com/log4cplus/log4cplus/releases/download/REL_2_2_1/log4cplus-2.2.1.tar.xz
src-sha: 4b2801aedcdb32476a6f139a93ca01c9dac5158682516ca5a02df68c600292c6
license: Apache-2.0

install: |
    cmakew 2 \
        -DLOG4CPLUS_BUILD_TESTING=OFF \
        -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
        -DLOG4CPLUS_HAVE_VSNPRINTF=ON \
        -DWITH_UNIT_TESTS=OFF

dotweak: mv lib/liblog4cplusS.a lib/liblog4cplus.a
