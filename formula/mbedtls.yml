pkgtype: exe+lib
summary: Cryptographic and SSL/TLS library
web-url: https://tls.mbed.org
src-url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.2.0/mbedtls-4.2.0.tar.bz2
src-sha: 2bed9d713b4668f76553b097e72b8aa30bc8f112a940d7ae228d524bbde6ffea
license: Apache-2.0
dep-pkg: libz

dopatch: |
    # https://github.com/Mbed-TLS/mbedtls/issues/8832
    if [ "$TARGET_PLATFORM_ARCH" = i686 ] ; then
        gsed -i '/#define MBEDTLS_AESNI_C/d' include/mbedtls/mbedtls_config.h
    fi

install: |
    cmakew \
        -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
        -DUSE_SHARED_MBEDTLS_LIBRARY=ON \
        -DUSE_PKCS11_HELPER_LIBRARY=OFF \
        -DUNSAFE_BUILD=OFF \
        -DMBEDTLS_FATAL_WARNINGS=OFF \
        -DINSTALL_MBEDTLS_HEADERS=ON \
        -DENABLE_PROGRAMS=ON \
        -DENABLE_TESTING=OFF \
        -DENABLE_ZLIB_SUPPORT=ON
