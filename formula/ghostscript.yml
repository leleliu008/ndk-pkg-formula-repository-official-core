pkgtype: exe+lib
summary: An interpreter for PostScript and PDF
web-url: https://www.ghostscript.com/
src-url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostpdl-10.08.0.tar.xz
src-sha: 94943e3c4adb7115d132b3c28b913672f2e62e6a9d802f7e754e716b1634174a
license: AGPL-3.0-or-later
dep-pkg: libidn liblcms2 libjbig2dec libfontconfig libtesseract liblanginfo
dep-upp: libz
xxflags: -std=c++11
binbstd: 1

dopatch: |
    rm -rf tesseract/ freetype/ jbig2dec/ openjpeg/ lcms2mt/ libpng/ expat/ jpeg/ tiff/ zlib/

    gsed -i '1i \#undef __printflike' base/gserrors.h

    gsed -i 's|-g -o|$(LDFLAGS) -o|' base/unix-dll.mak

    run ln -s "$PKG_CONFIG" "$TARGET_TRIPLE-pkg-config"
    export PATH="$PWD:$PATH"

prepare: |
    export CCAUX="$CC_FOR_BUILD"
    export CFLAGSAUX="$CFLAGS_FOR_BUILD $LDFLAGS_FOR_BUILD -std=gnu17"
    export CPPFLAGSAUX="$CPPFLAGS_FOR_BUILD"
    export LDFLAGSAUX="$LDFLAGS_FOR_BUILD"

install: |
    configure \
        --disable-compile-inits \
        --disable-cups \
        --disable-gtk \
        --with-system-libtiff \
        --without-x
    gmake  install-so
    gmakew libgs
    gmakew libgxps
    gmakew libgpdl
    gmakew libgpcl6
    cd bin
    find . -name '*.a' -printf '%P\n' | xargs -I {} mv {} lib{}
    install_libs  *.a

dotweak: |
    writepc libgs <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libgs
    Description: $PACKAGE_SUMMARY
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lgs
    Requires: fontconfig tesseract jbig2dec lcms2 libidn
    EOF
