summary: A smart and user-friendly command-line shell
web-url: https://fishshell.com/
src-url: https://github.com/fish-shell/fish-shell/releases/download/3.7.1/fish-3.7.1.tar.xz
src-sha: 614c9f5643cd0799df391395fa6bbc3649427bb839722ce3b114d3bbc1a3b250
license: GPL-2.0-or-later
dep-pkg: libpcre2 libreadline libposix_spawn
linkage: shared

dopatch: |
    gsed -i 's|FATAL_ERROR|WARNING|' CMakeLists.txt

    if [ "$ANDROID_NDK_VERSION_MAJOR" -ge 30 ] ; then
        gsed -i 's|__has_attribute(fallthrough)|0|' config_cmake.h.in
    fi

    # stdio.h: char* ctermid(char* __buf) __INTRODUCED_IN(26);
    if [ "$TARGET_PLATFORM_VERS" -lt 26 ] ; then
        gsed -i '/ctermid(nullptr)/c const char * tty = "/dev/tty";' src/reader.cpp
    fi

install: cmakew -DWITH_GETTEXT=OFF

api-min: 24
