pkgtype: exe+lib
summary: GNU internationalization (i18n) and localization (l10n) library
src-url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
src-sha: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
license: GPL-3.0-or-later
dep-pkg: libncurses libiconv

fix-url: https://raw.githubusercontent.com/leleliu008/patches/refs/heads/master/gettext-1.0-fix-syntax-error.patch
fix-sha: fa6a95a0ad332150580257bf55d5575aadd71884a0cf6b180f071296586f83bb

dopatch: |
    gsed -i '/SUBDIRS =/s|gettext-tools||g' Makefile.in
    gsed -i '/SUBDIRS =/s|gnulib-tests||g' gettext-tools/Makefile.in

install: |
    configure \
        --with-included-glib \
        --with-included-regex \
        --with-included-libxml \
        --with-included-gettext \
        --with-included-libcroco \
        --with-included-libunistring \
        --with-libiconv-prefix="$libiconv_INSTALL_DIR" \
        --with-libncurses-prefix="$libncurses_INSTALL_DIR" \
        --disable-acl \
        --disable-openmp \
        --disable-csharp \
        --disable-java \
        --enable-c++ \
        --enable-curses \
        --enable-threads=posix \
        --enable-libasprintf \
        --enable-namespacing \
        --enable-nls \
        --enable-relocatable \
        gl_cv_header_working_fcntl_h=yes

dotweak: |
    writepc libintl <<EOF
    prefix=\${pcfiledir}/../..
    exec_prefix=\${prefix}
    libdir=\${exec_prefix}/lib
    includedir=\${prefix}/include

    Name: libintl
    Description: National Language Support library
    Version: $PACKAGE_VERSION
    Cflags: -I\${includedir}
    Libs: -L\${libdir} -lintl
    Requires: libiconv
    EOF
