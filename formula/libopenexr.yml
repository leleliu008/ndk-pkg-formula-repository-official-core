summary: High dynamic-range image file format
web-url: https://www.openexr.com/
src-url: https://github.com/AcademySoftwareFoundation/openexr/archive/refs/tags/v3.5.2.tar.gz
src-sha: 85a291b9b8563fabef1aa3f6e912d744ce1d4b9fd5a8f978eda194cd51b15ae9
license: BSD-3-Clause
dep-pkg: libImath libz libzstd libdeflate libopenjph

dopatch: |
    # stdlib.h void* _Nullable aligned_alloc(size_t __alignment, size_t __size) __INTRODUCED_IN(28);
    if [ "$TARGET_PLATFORM_VERS" -lt 28 ] ; then
        gsed -i '/aligned_alloc/c void * p = NULL; posix_memalign (&p, 64, aligned_size); tls->shuffle_buf = (uint8_t*) p;' src/lib/OpenEXRCore/internal_zstd.c
    fi

install: |
    cmakew 2 \
        -DDOCS=OFF \
        -DOPENEXR_INSTALL=ON \
        -DOPENEXR_BUILD_TOOLS=OFF \
        -DOPENEXR_BUILD_EXAMPLES=OFF \
        -DOPENEXR_INSTALL_TOOLS=OFF \
        -DOPENEXR_INSTALL_EXAMPLES=OFF
