summary: ISO9660+RR manipulation tool
src-url: https://ftp.gnu.org/gnu/xorriso/xorriso-1.5.8.pl02.tar.gz
src-sha: b1455ecafbf0692ddafe1d71002a96f2ce2d77f4deae602678261ce033f97bc8
license: GPL-2.0-or-later
dep-pkg: libz libiconv liblanginfo

dopatch: |
    gsed -i '1i #include <unistd.h>' libisofs/rockridge.h

install: |
    configure \
        --enable-libacl \
        --enable-xattr \
        --enable-zlib \
        --enable-libbz2 \
        --enable-libcdio \
        --enable-jtethreads
