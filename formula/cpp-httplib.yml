summary: C++ header-only HTTP/HTTPS server and client library
src-url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.67.0.tar.gz
src-sha: be711ddaf7a3655d8f23aa5655709250b24d247aedd4b2629989d18b6164e5be
license: MIT
dep-pkg: libz libbrotli libopenssl
install: |
    cmakew \
        -DHTTPLIB_REQUIRE_ZLIB=ON \
        -DHTTPLIB_REQUIRE_BROTLI=ON \
        -DHTTPLIB_REQUIRE_OPENSSL=ON
